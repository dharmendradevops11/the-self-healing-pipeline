[project]
name = "the-self-healing-pipeline"
version = "1.1.0.dev0"
description = "Companion code for The Self-Healing Pipeline"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["healer*"]

[tool.pytest.ini_options]
testpaths = ["tests", "companion_code/tests"]
markers = ["integration: needs LocalStack (docker compose up)"]
addopts = "-ra -m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
# The book's published listings are left exactly as printed.
extend-exclude = ["chapters", "companion_code", "scenarios", "cdk.out", "localstack-data"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"scripts/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["chapters/"]
