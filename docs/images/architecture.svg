<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-labelledby="t d">
<title id="t">How an alert becomes a reviewed pull request</title>
<desc id="d">Sentry sends a signed webhook through API Gateway, SNS, SQS and an EventBridge Pipe into Step Functions. INGEST, INVESTIGATE, a gate, then FIX, TEST and a pull request, or ESCALATE with a report-only pull request. NOTIFY sends Slack and SNS. A human reviews and merges, and a GitHub webhook teaches the trust ledger.</desc>
